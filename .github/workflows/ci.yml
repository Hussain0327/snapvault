name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run integration tests
        run: make test
      - name: Build executable jar
        run: make jar
      - name: Smoke-test the packaged CLI
        run: java -jar build/snapvault.jar --version
